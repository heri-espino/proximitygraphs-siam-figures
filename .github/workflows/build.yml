name: Build reproducible SIAM figures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: figure-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install source library and renderer
        run: python -m pip install -r requirements.txt
      - name: Export mathematically authoritative scenes and artwork
        run: python scripts/export_scenes.py
      - name: Validate geometric invariants
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/editor.js
          node tests/test_editor.js
      - name: Review manuscript word count
        run: python scripts/check_article.py
      - name: List saved results
        run: ls -lh site/data/scenes.json site/assets/*.png site/assets/*.svg
      - uses: actions/upload-artifact@v4
        with:
          name: proximitygraphs-siam-figures
          path: |
            site/data/scenes.json
            site/assets/
      - name: Upload complete interactive website for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: proximitygraphs-siam-site-preview
          path: site/
      - name: Commit verified generated results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data/scenes.json site/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Export checked ProximityGraphs data and print figures"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update to main; retrying figures push ($attempt/8)"
              sleep 3
            done
            echo "Failed to publish verified figures after 8 attempts"
            exit 1
          fi

  # GitHub Pages requires a human owner to enable Source: GitHub Actions.
  # Also set repository Actions variable DEPLOY_PAGES=true to opt in.
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_PAGES == 'true'
    needs: figures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proximitygraphs-siam-figures
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
