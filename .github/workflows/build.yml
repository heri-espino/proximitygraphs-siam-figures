name: Build reproducible SIAM figures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install source library and renderer
        run: python -m pip install -r requirements.txt
      - name: Export mathematically authoritative scenes and artwork
        run: python scripts/export_scenes.py
      - name: Validate geometric invariants
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: node --check site/app.js
      - name: Review manuscript word count
        run: python scripts/check_article.py
      - name: List saved results
        run: ls -lh site/data/scenes.json site/assets/*.png site/assets/*.svg
      - uses: actions/upload-artifact@v4
        with:
          name: proximitygraphs-siam-figures
          path: |
            site/data/scenes.json
            site/assets/
      - name: Commit verified generated results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data/scenes.json site/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Export checked ProximityGraphs data and print figures"
            git push origin HEAD:main
          fi

  # GitHub Pages requires a human owner to enable Source: GitHub Actions.
  # Also set repository Actions variable DEPLOY_PAGES=true to opt in.
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_PAGES == 'true'
    needs: figures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proximitygraphs-siam-figures
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
