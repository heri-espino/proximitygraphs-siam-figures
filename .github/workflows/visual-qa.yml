name: Visual QA — interactive geometry laboratory

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/visual_smoke.py'
      - 'tests/article_browser_smoke.py'
      - '.github/workflows/visual-qa.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'data/historical/**'
      - 'scripts/export_scenes.py'
      - 'tests/visual_smoke.py'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate authoritative geometry for the exact checkout
        run: |
          python -m pip install -r requirements.txt
          python scripts/export_scenes.py
          python -m unittest discover -s tests -v
      - name: Install pinned browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render and test all mathematical interactive sections
        run: python tests/visual_smoke.py --output docs/visual-qa
      - name: Test four live embedded article views at desktop and mobile sizes
        run: python tests/article_browser_smoke.py --output docs/visual-qa
      - name: Preserve QA screenshots and summary as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proximitygraphs-visual-qa
          path: docs/visual-qa/
      - name: Commit reproducible visual QA outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-qa/
          if ! git diff --cached --quiet; then
            git commit -m "Archive visual construction witnesses and browser QA"
            # The visual test regenerates authoritative scene/artwork files.
            # Those are published independently by the figures workflow;
            # discard ONLY these uncommitted working-tree copies so rebase
            # cannot fail with a dirty checkout during concurrent CI pushes.
            git restore --worktree site/data/scenes.json site/assets/
            # The fourth SVG was not tracked in the initial checkout, so the
            # renderer can leave it untracked before the exporter commits it.
            # Clean ONLY this generated file to unblock concurrent rebase.
            git clean -f -- site/assets/figure04-compare.svg
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent main update; retrying visual QA push ($attempt/8)"
              sleep 3
            done
            echo "Visual QA files were not committed after 8 attempts"
            exit 1
          fi
